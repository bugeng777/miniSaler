<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <!-- Pixel Wall Street app icon: all geometry follows a 4 px grid. -->
  <rect width="128" height="128" fill="#0a0b14"/>
  <rect x="8" y="8" width="112" height="112" fill="#3b5dc9"/>
  <rect x="12" y="12" width="104" height="104" fill="#0a0b14"/>
  <rect x="16" y="16" width="96" height="96" fill="#1a1c2c"/>

  <!-- Stepped RPG corners. -->
  <g fill="#f7b801">
    <rect x="4" y="12" width="8" height="16"/><rect x="12" y="4" width="16" height="8"/>
    <rect x="116" y="12" width="8" height="16"/><rect x="100" y="4" width="16" height="8"/>
    <rect x="4" y="100" width="8" height="16"/><rect x="12" y="116" width="16" height="8"/>
    <rect x="116" y="100" width="8" height="16"/><rect x="100" y="116" width="16" height="8"/>
  </g>

  <!-- Pixel candlesticks. -->
  <g fill="#38b764">
    <rect x="28" y="60" width="4" height="32"/><rect x="24" y="68" width="12" height="16"/>
    <rect x="52" y="40" width="4" height="44"/><rect x="48" y="48" width="12" height="20"/>
    <rect x="76" y="32" width="4" height="36"/><rect x="72" y="40" width="12" height="16"/>
  </g>
  <g fill="#e8434a">
    <rect x="40" y="52" width="4" height="36"/><rect x="36" y="56" width="12" height="20"/>
    <rect x="64" y="44" width="4" height="32"/><rect x="60" y="52" width="12" height="16"/>
  </g>

  <!-- Rising market arrow. -->
  <g fill="#f7b801">
    <rect x="28" y="96" width="12" height="4"/><rect x="40" y="88" width="12" height="4"/>
    <rect x="52" y="80" width="12" height="4"/><rect x="64" y="72" width="20" height="4"/>
    <rect x="80" y="64" width="4" height="12"/><rect x="84" y="60" width="12" height="4"/>
    <rect x="92" y="60" width="4" height="16"/>
  </g>

  <!-- Small ticker pixels give the icon a terminal/game feel. -->
  <rect x="24" y="104" width="32" height="4" fill="#94b0c2"/>
  <rect x="60" y="104" width="12" height="4" fill="#333c57"/>
  <rect x="76" y="104" width="28" height="4" fill="#94b0c2"/>
</svg>
